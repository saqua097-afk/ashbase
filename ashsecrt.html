<style>
  :root{
    --paper: #e9e1c9;
    --paper-dark: #ddd2b0;
    --ink: #23201a;
    --ink-soft: #4a463c;
    --red: #9c1f1f;
    --red-deep: #6f1414;
    --line: #b9ac85;
    --redact: #1a1815;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 15% 10%, rgba(0,0,0,0.05), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(0,0,0,0.06), transparent 45%);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    min-height:100vh;
  }
  h1,h2,h3,.stamp,.tab-btn,.doc-num{ font-family:'Oswald', sans-serif; }

  /* ================= ГЕЙТ ДОСТУПА ================= */
  #gate{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .gate-box{
    width:100%; max-width: 480px;
    background: var(--paper-dark);
    border: 2px solid var(--ink);
    padding: 40px 34px;
    position:relative;
  }
  .gate-box::before{
    content:"";
    position:absolute; inset:8px;
    border: 1px solid var(--red-deep);
    pointer-events:none;
  }
  .seal{
    width:64px; height:64px;
    border: 3px solid var(--red);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px;
    color: var(--red);
    font-size: 26px;
    font-weight:700;
  }
  .gate-eyebrow{
    text-align:center;
    letter-spacing:4px;
    font-size:12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .gate-box h1{
    text-align:center;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--red-deep);
    margin-bottom: 22px;
    text-transform:uppercase;
  }
  .gate-box label{
    display:block;
    font-size:12px;
    color: var(--ink-soft);
    margin-bottom:8px;
    letter-spacing:1px;
  }
  .gate-box input{
    width:100%;
    background: var(--paper);
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family:'Courier Prime', monospace;
    font-size:16px;
    padding: 11px 13px;
    outline:none;
    letter-spacing:2px;
  }
  .gate-box input:focus{ border-color: var(--red); }
  .gate-box button{
    width:100%;
    margin-top:18px;
    background: var(--red-deep);
    border: 1px solid var(--red);
    color: var(--paper);
    font-family:'Oswald', sans-serif;
    letter-spacing: 3px;
    font-size:13px;
    padding: 13px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .gate-box button:hover{ background: var(--red); }
  .gate-err{
    color: var(--red);
    font-size:12px;
    text-align:center;
    margin-top:12px;
    min-height:16px;
    letter-spacing:1px;
  }

  /* ================= АРХИВ ================= */
  #archive{ display:none; }
  #archive.active{ display:block; }

  header.top-bar{
    background: var(--ink);
    color: var(--paper);
    padding: 16px 26px;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom: 4px solid var(--red-deep);
  }
  header.top-bar .title{
    letter-spacing:3px;
    font-size:14px;
  }
  header.top-bar .title small{
    display:block;
    color:#a89f88;
    font-size:10px;
    letter-spacing:2px;
    margin-top:2px;
  }
  header.top-bar button{
    background:transparent;
    border:1px solid #6b6455;
    color:#c9c2ae;
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:2px;
    padding:8px 14px;
    cursor:pointer;
  }
  header.top-bar button:hover{ border-color: var(--red); color: var(--red); }

  .layout{
    display:flex;
    max-width: 1200px;
    margin: 0 auto;
    min-height: calc(100vh - 68px);
  }

  /* -------- боковая картотека -------- */
  nav.catalog{
    width: 230px;
    flex-shrink:0;
    border-right: 2px solid var(--ink);
    background: var(--paper-dark);
    padding: 18px 0;
  }
  nav.catalog .catalog-title{
    font-size:11px;
    letter-spacing:2px;
    color: var(--ink-soft);
    padding: 0 18px 12px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 6px;
  }
  .tab-btn{
    display:flex; align-items:baseline; gap:10px;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-bottom: 1px solid var(--line);
    padding: 11px 18px;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .tab-btn .doc-num{ color: var(--red-deep); font-size:11px; }
  .tab-btn:hover{ background: rgba(156,31,31,0.08); color: var(--ink); }
  .tab-btn.selected{
    background: var(--paper);
    color: var(--ink);
    border-left: 4px solid var(--red);
    padding-left: 14px;
    font-weight:700;
  }

  /* -------- содержимое досье -------- */
  main.reader{
    flex:1;
    padding: 34px 40px;
  }
  .dossier{ display:none; }
  .dossier.active{ display:block; }

  .doc-frame{
    background: var(--paper-dark);
    border: 2px solid var(--ink);
    padding: 30px 34px;
    position:relative;
    max-width: 720px;
  }
  .stamp{
    position:absolute;
    top: 18px; right: 22px;
    border: 3px solid var(--red);
    color: var(--red);
    padding: 5px 12px;
    font-size: 11px;
    letter-spacing:2px;
    transform: rotate(-8deg);
    opacity:0.85;
    text-transform:uppercase;
  }
  .doc-frame .doc-title{
    font-size: 19px;
    letter-spacing:1px;
    color: var(--red-deep);
    text-transform:uppercase;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 16px;
    max-width: 78%;
  }
  .doc-meta{
    font-size:11.5px;
    color: var(--ink-soft);
    line-height:1.8;
    margin-bottom: 18px;
    border-left: 3px solid var(--line);
    padding-left: 12px;
  }
  .doc-body p{
    font-size: 14px;
    line-height: 1.85;
    margin-bottom: 12px;
    max-width: 62ch;
  }
  .redacted{
    display:inline-block;
    background: var(--redact);
    color: var(--redact);
    padding: 0 6px;
    user-select:none;
  }

  @media (max-width: 760px){
    .layout{ flex-direction:column; }
    nav.catalog{ width:100%; display:flex; overflow-x:auto; padding:10px 0; }
    nav.catalog .catalog-title{ display:none; }
    .tab-btn{ border-bottom:none; border-right:1px solid var(--line); white-space:nowrap; }
    .tab-btn.selected{ border-left:none; border-bottom:4px solid var(--red); padding-left:18px; }
    main.reader{ padding: 20px; }
    .doc-frame{ padding: 22px; }
  }
</style>

<script>
  // Пароль доступа — поменяйте на свой прямо здесь:
  const PASSWORD = "фимозводана";

  const gate = document.getElementById('gate');
  const archive = document.getElementById('archive');
  const pwd = document.getElementById('pwd');
  const err = document.getElementById('gateErr');

  function unlock(){
    if(pwd.value === PASSWORD){
      gate.style.display = 'none';
      archive.classList.add('active');
    } else {
      err.textContent = 'ДОСТУП ОТКЛОНЁН — неверный код';
      pwd.value = '';
    }
  }
  document.getElementById('unlockBtn').addEventListener('click', unlock);
  pwd.addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
  document.getElementById('lockBtn').addEventListener('click', () => {
    archive.classList.remove('active');
    gate.style.display = 'flex';
    err.textContent = '';
  });

  const catalog = document.getElementById('catalog');
  const reader = document.getElementById('reader');

  DOSSIERS.forEach((d, i) => {
    const num = String(i + 1).padStart(2, '0');

    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' selected' : '');
    btn.dataset.target = 'd' + (i + 1);
    btn.innerHTML = `<span class="doc-num">${num}</span><span>${d.title}</span>`;
    catalog.appendChild(btn);

    const paragraphs = d.text.split(/\n\s*\n/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('');

    const doc = document.createElement('div');
    doc.className = 'dossier' + (i === 0 ? ' active' : '');
    doc.id = 'd' + (i + 1);
    doc.innerHTML = `
      <div class="doc-frame">
        <div class="stamp">${d.stamp}</div>
        <div class="doc-title">${d.title}</div>
        <div class="doc-meta">${d.meta}</div>
        <div class="doc-body">${paragraphs}</div>
      </div>`;
    reader.appendChild(doc);
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('selected'));
      document.querySelectorAll('.dossier').forEach(d => d.classList.remove('active'));
      btn.classList.add('selected');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>
